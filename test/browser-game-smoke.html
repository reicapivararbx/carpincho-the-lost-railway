<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#081208;color:#fff;font:16px sans-serif}canvas{width:800px;height:500px}#status{position:fixed;left:12px;top:12px;background:#000c;padding:12px;border:2px solid #d4a843}</style></head><body><canvas id="game-canvas" width="800" height="500"></canvas><div id="status">INICIANDO</div><div id="hotbar"></div><div id="global-notifs"></div><script type="module">
const status=document.getElementById('status');try{const {Game}=await import('/js/game.js');const game=new Game(document.getElementById('game-canvas'));game.update(.016);game.renderer.render(game.scene,game.camera);const required=['trainPoints','playerAnimator','worldStreaming','fogOfWar','particlePool','projectilePool','mobPool'];for(const key of required)if(!game[key])throw new Error(`ausente ${key}`);status.textContent=`OK • ${game.currentRegion.name} • ${game.train.wagons.length} vagão • ${game.resources.length} recursos`;status.dataset.result='ok';document.body.dataset.result='ok'}catch(error){status.textContent=`ERRO: ${error.stack||error}`;status.dataset.result='error';document.body.dataset.result='error';console.error(error)}</script></body></html>
