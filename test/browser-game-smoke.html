<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#081208;color:#fff;font:16px sans-serif;overflow:hidden}canvas{width:100vw;height:100vh}#status{position:fixed;z-index:5;left:12px;top:12px;background:#000d;padding:12px;border:2px solid #d4a843}</style></head><body><canvas id="game-canvas"></canvas><div id="status">INICIANDO</div><div id="hotbar"></div><div id="global-notifs"></div><script type="module">
const status=document.getElementById('status');try{const {Game}=await import('/js/game.js');const game=new Game(document.getElementById('game-canvas'));for(let frame=0;frame<45;frame++)game.update(1/60);for(let attempt=0;attempt<30&&(!game.assets.capybara||!game.assets.tree);attempt++)await new Promise(resolve=>setTimeout(resolve,50));game.renderer.render(game.scene,game.camera);const required=['ctx','trainPoints','playerAnimator','worldStreaming','fogOfWar','particlePool','projectilePool','mobPool'];for(const key of required)if(!game[key])throw new Error(`ausente ${key}`);if(!game.assets.capybara||!game.assets.locomotive||!game.assets.tree||!game.assets.rock||!game.assets.grass)throw new Error('assets realistas não carregaram');status.textContent=`OK 2D REALISTA • ${game.currentRegion.name} • ${game.train.wagons.length} vagão • ${game.resources.length} recursos`;status.dataset.result='ok';document.body.dataset.result='ok'}catch(error){status.textContent=`ERRO: ${error.stack||error}`;status.dataset.result='error';document.body.dataset.result='error';console.error(error)}</script></body></html>
